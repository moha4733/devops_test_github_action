name: Test greeting secret

on:
  workflow_dispatch:

permissions: {}

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollér secret
        env:
          GREETINGS: ${{ secrets.greetings }}
        run: |
          if [ -z "$GREETINGS" ]; then
            echo "Secret greetings mangler eller er tom."
            exit 1
          fi
          echo "Secret greetings er tilgængelig."